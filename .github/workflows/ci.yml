name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  laser-card-jig:
    name: Laser Card Jig
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/laser-card-jig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/laser-card-jig/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
