<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jenga Configurator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body { height: 100%; background: #5b3a36; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React UMD -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <!-- Babel for on-the-fly JSX transform -->
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

    <!-- Load the app. Using type=text/babel to transpile JSX in the browser. -->
    <script type="text/babel" data-presets="env,react" src="/app.jsx"></script>
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.getElementById('root'));
      const App = window.JengaConfigurator || (typeof JengaConfigurator !== 'undefined' ? JengaConfigurator : null);
      if (!App) {
        const Fallback = () => React.createElement('div', {style:{color:'white', padding:'1rem'}}, 'App failed to load');
        root.render(React.createElement(Fallback));
      } else {
        root.render(React.createElement(App));
      }
    </script>
  </body>
  </html>
